name: CI/CD Backend

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: cluster-innovatech

jobs:
  deploy-ventas:
    name: Build, push y deploy back-ventas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (sesion AWS Academy Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push imagen back-ventas
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE: back-ventas
        run: |
          docker build -t $REGISTRY/$IMAGE:${{ github.sha }} \
            -t $REGISTRY/$IMAGE:latest \
            ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $REGISTRY/$IMAGE:${{ github.sha }}
          docker push $REGISTRY/$IMAGE:latest

      - name: Descargar task definition actual de back-ventas
        run: |
          aws ecs describe-task-definition --task-definition back-ventas \
            --query taskDefinition --output json > task-def-ventas.json

      - id: render-ventas
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-ventas.json
          container-name: back-ventas
          image: ${{ steps.login-ecr.outputs.registry }}/back-ventas:${{ github.sha }}

      - name: Deploy a ECS (svc-back-ventas)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ventas.outputs.task-definition }}
          service: svc-back-ventas
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-despachos:
    name: Build, push y deploy back-despachos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (sesion AWS Academy Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push imagen back-despachos
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE: back-despachos
        run: |
          docker build -t $REGISTRY/$IMAGE:${{ github.sha }} \
            -t $REGISTRY/$IMAGE:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $REGISTRY/$IMAGE:${{ github.sha }}
          docker push $REGISTRY/$IMAGE:latest

      - name: Descargar task definition actual de back-despachos
        run: |
          aws ecs describe-task-definition --task-definition back-despachos \
            --query taskDefinition --output json > task-def-despachos.json

      - id: render-despachos
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-despachos.json
          container-name: back-despachos
          image: ${{ steps.login-ecr.outputs.registry }}/back-despachos:${{ github.sha }}

      - name: Deploy a ECS (svc-back-despachos)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-despachos.outputs.task-definition }}
          service: svc-back-despachos
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
